x-scheduler-image: &scheduler-image
  image: ${SCHEDULER_IMAGE:-scheduler-saas:phase1}
  build:
    context: ..
    dockerfile: Dockerfile

x-scheduler-environment: &scheduler-environment
  TZ: Asia/Shanghai
  SCHEDULER_STATE_BACKEND: sqlite
  SCHEDULER_DATABASE_PATH: /app/outputs/platform/scheduler.db
  SCHEDULER_ORGANIZATION_SLUG: ${SCHEDULER_ORGANIZATION_SLUG:-current-school}
  SCHEDULER_AUTH_MODE: required
  SCHEDULER_SOLVE_MODE: async
  SCHEDULER_COOKIE_SECURE: ${SCHEDULER_COOKIE_SECURE:-true}
  SCHEDULER_ALLOW_INSECURE_HTTP: ${SCHEDULER_ALLOW_INSECURE_HTTP:-false}
  SCHEDULER_ENABLE_HSTS: ${SCHEDULER_ENABLE_HSTS:-true}
  SCHEDULER_TRUST_PROXY_HEADERS: ${SCHEDULER_TRUST_PROXY_HEADERS:-true}
  SCHEDULER_LOGIN_RATE_LIMIT_SECRET: ${SCHEDULER_LOGIN_RATE_LIMIT_SECRET:?set SCHEDULER_LOGIN_RATE_LIMIT_SECRET}
  SCHEDULER_SESSION_TTL_SECONDS: ${SCHEDULER_SESSION_TTL_SECONDS:-28800}
  SCHEDULER_MAX_JSON_BYTES: ${SCHEDULER_MAX_JSON_BYTES:-1048576}
  SCHEDULER_AI_ENFORCE_PUBLIC_NETWORK: ${SCHEDULER_AI_ENFORCE_PUBLIC_NETWORK:-true}
  SCHEDULER_AI_ALLOWED_HOSTS: ${SCHEDULER_AI_ALLOWED_HOSTS:-}
  SCHEDULER_CONVERSATIONAL_SCHEDULING_ENABLED: ${SCHEDULER_CONVERSATIONAL_SCHEDULING_ENABLED:-false}
  DOMESTIC_AI_API_KEY: ${DOMESTIC_AI_API_KEY:-}

x-scheduler-runtime: &scheduler-runtime
  <<: *scheduler-image
  environment: *scheduler-environment
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  volumes:
    - scheduler_data:/app/outputs

services:
  bootstrap:
    <<: *scheduler-runtime
    command:
      - scheduler-platform
      - --database
      - /app/outputs/platform/scheduler.db
      - migrate-yaml
      - --yaml
      - /app/deploy/seed/blank_school.yaml
      - --slug
      - ${SCHEDULER_ORGANIZATION_SLUG:-current-school}
      - --name
      - ${SCHEDULER_ORGANIZATION_NAME:-当前学校}
      - --actor
      - bootstrap
    restart: "no"

  admin-bootstrap:
    <<: *scheduler-runtime
    command:
      - scheduler-platform
      - --database
      - /app/outputs/platform/scheduler.db
      - ensure-user
      - --slug
      - ${SCHEDULER_ORGANIZATION_SLUG:-current-school}
      - --username
      - ${SCHEDULER_BOOTSTRAP_USERNAME:-admin}
      - --display-name
      - ${SCHEDULER_BOOTSTRAP_DISPLAY_NAME:-教务管理员}
      - --role
      - academic_admin
      - --password-file
      - /run/secrets/scheduler_admin_password
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    secrets:
      - scheduler_admin_password
    restart: "no"

  web:
    <<: *scheduler-runtime
    command: ["scheduler-web", "--host", "0.0.0.0", "--port", "8765"]
    depends_on:
      admin-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: ${SCHEDULER_WEB_MEMORY:-1g}
    cpus: ${SCHEDULER_WEB_CPUS:-1.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *scheduler-runtime
    command: ["scheduler-worker", "--poll-seconds", "2", "--lease-timeout-seconds", "120"]
    depends_on:
      admin-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 45s
    mem_limit: ${SCHEDULER_WORKER_MEMORY:-4g}
    cpus: ${SCHEDULER_WORKER_CPUS:-4.0}
    healthcheck:
      test:
        - CMD
        - scheduler-platform
        - --database
        - /app/outputs/platform/scheduler.db
        - health
        - --slug
        - ${SCHEDULER_ORGANIZATION_SLUG:-current-school}
        - --require-worker
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2.10-alpine
    profiles: ["tls"]
    depends_on:
      web:
        condition: service_healthy
    environment:
      SCHEDULER_DOMAIN: ${SCHEDULER_DOMAIN:-scheduler.example.cn}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  scheduler_data:
  caddy_data:
  caddy_config:

secrets:
  scheduler_admin_password:
    file: ${SCHEDULER_ADMIN_PASSWORD_FILE:-./secrets/admin_password}
