name: Release gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run development and SaaS gates
        run: python verification/fixes/run_dev_gate.py

      - name: Build Python wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Upload wheel
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: scheduler-wheel-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  container-smoke:
    runs-on: ubuntu-latest
    needs: python-gate
    timeout-minutes: 30
    env:
      SCHEDULER_LOGIN_RATE_LIMIT_SECRET: github-actions-isolated-smoke-only
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare isolated administrator secret
        run: |
          install -d -m 700 deploy/secrets
          python -c "import pathlib, secrets; pathlib.Path('deploy/secrets/admin_password').write_text(secrets.token_urlsafe(32), encoding='utf-8')"
          chmod 600 deploy/secrets/admin_password
          sudo chown 10001:10001 deploy/secrets/admin_password

      - name: Validate Compose model
        run: docker compose -f deploy/compose.yaml -f deploy/compose.local.yaml config --quiet

      - name: Build and start isolated stack
        run: >-
          docker compose -f deploy/compose.yaml -f deploy/compose.local.yaml
          up --build --detach --wait --wait-timeout 180 web worker

      - name: Verify Web and Worker health
        run: |
          curl --fail --show-error --silent http://127.0.0.1:8765/api/health/live
          curl --fail --show-error --silent http://127.0.0.1:8765/api/health/ready
          docker compose -f deploy/compose.yaml -f deploy/compose.local.yaml exec -T worker \
            scheduler-platform --database /app/outputs/platform/scheduler.db \
            health --slug current-school --require-worker

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml -f deploy/compose.local.yaml logs --no-color bootstrap admin-bootstrap web worker

      - name: Remove isolated stack
        if: always()
        run: docker compose -f deploy/compose.yaml -f deploy/compose.local.yaml down --volumes --remove-orphans
