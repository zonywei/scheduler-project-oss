[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-orchestrated-optimization"
version = "0.2.0"
description = "AI-orchestrated, rule-first optimization framework with a K12 scheduling application"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "ortools==9.15.6755",
    "pandas==2.3.2",
    "openpyxl==3.1.5",
    "PyYAML==6.0.3",
    "reportlab==4.4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
scheduler-web = "scheduler.app.web:main"
scheduler-platform = "scheduler.platform.cli:main"
scheduler-worker = "scheduler.platform.worker:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_orchestrated_optimization*", "profiles*", "scheduler*"]

[tool.setuptools.package-data]
scheduler = [
    "app/static/*.html",
    "app/static/*.css",
    "app/static/*.js",
    "app/static/assets/*.png",
    "app/static/assets/brand/*.png",
    "app/static/vendor/*.js",
    "app/static/vendor/remixicon/*",
    "config/io.yaml",
    "config/rules.yaml",
]
profiles = ["*/*.yaml"]

[tool.setuptools.exclude-package-data]
scheduler = ["config/web_overrides.yaml"]
"scheduler.config" = ["web_overrides.yaml"]

[tool.ai-orchestrated-optimization]
runtime-requirements = "requirements.txt"
dev-requirements = "requirements-dev.txt"
