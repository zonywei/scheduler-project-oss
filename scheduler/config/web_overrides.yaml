change_audit:
  entries:
  - id: cfg_20260506022243_48aa9e02
    timestamp: '2026-05-06T02:22:43+00:00'
    actor: codex
    source: rules.configure
    reason: 提高晚查寝当天有晚自习权重，优先减少发布前 soft 例外
    changes:
    - label: checkin.w_require_teacher_has_class_that_day
      store: rules
      path:
      - checkin
      - w_require_teacher_has_class_that_day
      full_path: rules.checkin.w_require_teacher_has_class_that_day
      before_exists: true
      before: 3000
      after: 20000
  - id: cfg_20260506014251_303148f6
    timestamp: '2026-05-06T01:42:51+00:00'
    actor: codex
    source: diagnosis.joint_feasibility
    reason: 联合模式正式求解无解；诊断证明男班主任查寝总次数目标需软化，且白天-晚自习联动三条硬链路降为可审计软约束后可生成候选课表。
    changes:
    - label: 白天无课不得晚自习/晚查寝模式
      store: io
      path:
      - day_night_link
      - night_requires_day_mode
      full_path: io.day_night_link.night_requires_day_mode
      before_exists: false
      before: null
      after: soft
    - label: 周日晚自习后周一上午1禁排模式
      store: io
      path:
      - day_night_link
      - sun_night_no_mon_am1_mode
      full_path: io.day_night_link.sun_night_no_mon_am1_mode
      before_exists: false
      before: null
      after: soft
    - label: 周日下午+周日晚自习后周一上午禁排模式
      store: io
      path:
      - day_night_link
      - sun_pm_night_no_mon_am_mode
      full_path: io.day_night_link.sun_pm_night_no_mon_am_mode
      before_exists: false
      before: null
      after: soft
    - label: 男班主任查寝周目标模式
      store: io
      path:
      - day
      - duty_joint_constraints
      - male_total_target_mode
      full_path: io.day.duty_joint_constraints.male_total_target_mode
      before_exists: false
      before: null
      after: soft
    - label: 男班主任查寝目标偏离罚分
      store: io
      path:
      - day
      - duty_joint_constraints
      - w_male_total_target_deviation
      full_path: io.day.duty_joint_constraints.w_male_total_target_deviation
      before_exists: false
      before: null
      after: 2500
  - id: cfg_20260506011339_d38b02a6
    timestamp: '2026-05-06T01:13:39+00:00'
    actor: codex
    source: diagnosis.checkin.same_day_soft
    reason: 夜间正式求解无可行解；诊断试跑证明只需将晚查寝教师当天有晚自习从硬约束降为可审计软约束即可生成候选课表。
